<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Mayank Kumar Sahu - Java Backend and Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="240" fill="url(#bg)"/>

  <!-- animated waves -->
  <path fill="#ffffff" fill-opacity="0.08"
        d="M0,185 q125,-45 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V240 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#00f7ff" fill-opacity="0.10"
        d="M0,200 q125,40 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V240 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#ffffff" opacity="0">
    Mayank Kumar Sahu
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </text>
  <text x="500" y="150" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#00f7ff" opacity="0">
    Java Backend &amp; Full-Stack Developer
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.8s" fill="freeze"/>
  </text>
</svg>
